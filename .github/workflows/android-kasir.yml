# Build APK Android "BABA Kasir" (kasir ERP di tablet/HP) otomatis dari folder android/.
#
# Hasil: GitHub → tab Actions → "Android BABA Kasir" → run terbaru → "Artifacts" → baba-kasir-apk
#        (berisi baba-kasir.apk + versi-kasir.json). Unggah baba-kasir.apk ke hosting ERP: public/downloads/
#        → bisa diunduh dari /unduh/baba-kasir.apk (link ada di Panduan "Cetak Struk Tanpa Pilih Printer").
#
# Berjalan otomatis bila folder android/ (atau file ini) berubah di branch main, atau manual: Run workflow.
#
# Kunci tanda tangan = kunci BABA PARFUME yang sama dengan APK member (WAJIB, supaya update bisa dipasang
# di atas versi lama). Isi di repo baba_erp → Settings → Secrets and variables → Actions:
#   BABA_KEYSTORE_BASE64   — isi file keystore (PKCS12) dalam base64
#   BABA_KEYSTORE_PASSWORD — password keystore & kunci
name: Android BABA Kasir

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-kasir.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Siapkan kunci tanda tangan
        id: kunci
        env:
          KEYSTORE_BASE64: ${{ secrets.BABA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret BABA_KEYSTORE_BASE64 belum diisi — APK resmi tidak dibuat."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/baba.p12"
          echo "path=$RUNNER_TEMP/baba.p12" >> "$GITHUB_OUTPUT"

      - name: Build APK release
        working-directory: android
        env:
          BABA_KEYSTORE_PATH: ${{ steps.kunci.outputs.path }}
          BABA_KEYSTORE_PASSWORD: ${{ secrets.BABA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Periksa tanda tangan & siapkan hasil
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256" | awk '{print $NF}')
          if [ "$SHA" != "63a86d6230580f1bd2b62a982383ae062f55c3dc29cdeb06241c42f37b53e8fd" ]; then
            echo "::error::Tanda tangan APK bukan kunci BABA PARFUME ($SHA)."
            exit 1
          fi
          mkdir -p apk-out
          cp "$APK" apk-out/baba-kasir.apk
          printf '{"versionCode": %s, "versionName": "1.0.%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > apk-out/versi-kasir.json
          ls -l apk-out

      - uses: actions/upload-artifact@v4
        with:
          name: baba-kasir-apk
          path: apk-out/
          retention-days: 90
